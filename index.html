<!-- WORLD SIMULATOR — FILE RULES
  1) Keep this file in the flattened project root/relative path when packaging; never add a second project-folder layer.
  2) Preserve mobile-safe viewport/layout behavior and existing module load order.
  3) Settings choices must visually support exactly one active option per setting row.
  4) Keep this header at the top of the file when making future edits.
-->

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>World Simulator — God Sandbox</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-emblem">🧭</div>
    <div class="loading-spinner" aria-hidden="true"></div>
    <p id="loading-text" class="loading-text">กำลังสร้างโลก...</p>
  </div>
  <div id="app">
    <canvas id="game" aria-label="World Simulator map"></canvas>

    <header class="topbar">
      <div class="brand">
        <span id="date">Year 1 • Spring • Day 1 • 06:00</span>
      </div>
      <div class="stats" aria-label="World statistics">
        <span>👥 <b id="pop">0</b></span>
        <span>🏘️ <b id="cities">0</b></span>
        <span><svg class="icon-inline icon-inline--auto" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 3 L19 5.6 L19 11.5 C19 16 16 19.3 12 21 C8 19.3 5 16 5 11.5 L5 5.6 Z"
            fill="#f6c343" stroke="#7a4a06" stroke-width="1" stroke-linejoin="round"/>
          <path d="M12 3 L19 5.6 L19 11.5 C19 16 16 19.3 12 21 Z" fill="#c8890f" opacity=".55"/>
          <path d="M9 14.4 L9 10 L12 12 L15 10 L15 14.4" fill="none" stroke="#8a1f2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="9" r="1.2" fill="#8a1f2b"/>
        </svg> <b id="kingdoms">0</b></span>
        <span>🐾 <b id="animals">0</b></span>
      </div>
    </header>

    <div class="right-dock">
      <div id="fps-counter" class="fps-badge hidden" aria-live="off">0 FPS</div>
      <canvas id="minimap" width="160" height="100" aria-label="แผนที่ย่อ กดเพื่อเลื่อนกล้อง"></canvas>
      <div class="zoom-controls" role="group" aria-label="ซูมแผนที่">
        <button id="zoom-out" type="button" title="ซูมออก (–)" aria-label="ซูมออก"><span>−</span></button>
        <button id="zoom-in" type="button" title="ซูมเข้า (+)" aria-label="ซูมเข้า"><span>+</span></button>
      </div>
      <label class="brush-control hidden"><input id="brush" type="range" min="1" max="4" value="1"><b id="brush-value">1</b></label>
    </div>

    <div id="panel-overlay" class="modal-overlay hidden">
      <aside id="panel" class="panel" aria-live="polite"></aside>
    </div>
    <div id="dashboard-overlay" class="modal-overlay hidden">
      <aside id="dashboard-panel" class="dashboard-panel" aria-live="polite"></aside>
    </div>
    <button id="modal-close-btn" type="button" class="modal-close-btn hidden" aria-label="ปิด">×</button>
    <div id="paused-banner" class="paused-banner hidden"><svg class="icon-inline" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><rect x="6.5" y="5" width="3.4" height="14" rx="1"/><rect x="14.1" y="5" width="3.4" height="14" rx="1"/></svg> หยุดเวลาไว้ชั่วคราว</div>

    <div class="bottom-dock">
      <nav class="tool-categories" aria-label="หมวดหมู่เครื่องมือ">
        <button data-category="territory" title="ดูเขตแดน">เขตแดน</button>
        <button data-category="creatures" title="สิ่งมีชีวิต">สิ่งมีชีวิต</button>
        <button data-category="terrain" title="ภูมิประเทศ">ภูมิประเทศ</button>
        <button data-category="disasters" title="ภัยพิบัติ">ภัยพิบัติ</button>
      </nav>
      <nav class="tools" aria-label="God tools">
        <!-- Normal mode: shown by default, and again whenever the active
             category tab above is tapped a second time to close it. -->
        <button data-tool="select" data-group="normal" data-label="เลือก" class="active"><svg class="ti" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3l14 8-6 1.4-2.6 6.6z"/></svg></button>
        <button data-speed="0" data-group="normal" title="Space"><svg class="ti" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6.5" y="5" width="3.4" height="14" rx="1"/><rect x="14.1" y="5" width="3.4" height="14" rx="1"/></svg></button>
        <button data-speed="1" data-group="normal" class="active" title="1"><span>1×</span></button>
        <button data-speed="2" data-group="normal" title="2"><span>2×</span></button>
        <button data-speed="5" data-group="normal" title="3"><span>5×</span></button>
        <button data-speed="10" data-group="normal" title="4"><span>10×</span></button>
        <button id="save" data-group="normal" title="บันทึกโลก"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4"/><rect x="8" y="14" width="8" height="6"/></svg></button>
        <button id="load" data-group="normal" title="โหลดโลกที่บันทึกไว้"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V3"/><path d="M8 8l4-5 4 5"/><path d="M4 19h16"/></svg></button>
        <div class="tools-gap" data-group="normal" aria-hidden="true"></div>
        <button id="new-world" data-group="normal" title="สร้างโลกใหม่"><svg class="ti" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg></button>
        <button id="settings-btn" data-group="normal" title="ตั้งค่า"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="15" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="9" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="17" cy="18" r="2" fill="currentColor" stroke="none"/></svg></button>
        <button id="events" data-group="normal" title="ดูประวัติโลก"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9a3 3 0 0 1 3 3v10a3 3 0 0 0 3 3"/><path d="M6 4a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h12"/><line x1="8" y1="9" x2="15" y2="9"/><line x1="8" y1="13" x2="15" y2="13"/></svg></button>
        <button id="dashboard-open" data-group="normal" title="แดชบอร์ดโลก"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="13" width="3" height="7"/><rect x="11" y="9" width="3" height="11"/><rect x="16" y="5" width="3" height="15"/></svg></button>

        <!-- Territory category -->
        <button data-overlay="none" data-group="territory" class="active" title="ปกติ"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/></svg></button>
        <button data-overlay="city" data-group="territory" title="เขตเมือง"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 21V11l4-3 4 3v10"/><path d="M11 21V8l5-4 5 4v13"/><line x1="3" y1="21" x2="21" y2="21"/></svg></button>
        <button data-overlay="kingdom" data-group="territory" title="เขตอาณาจักร"><svg class="ti" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/></svg></button>
        <button data-overlay="civilization" data-group="territory" title="เขตอารยธรรม"><span class="civ-symbol civ-symbol--tool"><img class="civ-symbol-img" src="images/civilization/temple.png" alt="เขตอารยธรรม" onerror="this.onerror=function(){this.parentElement.classList.add('civ-symbol--fallback')};this.src='images/culture/level-1.png'"><span class="civ-symbol-fallback"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 21 8 3 8"/><line x1="4" y1="20" x2="20" y2="20"/><line x1="6" y1="10" x2="6" y2="18"/><line x1="10" y1="10" x2="10" y2="18"/><line x1="14" y1="10" x2="14" y2="18"/><line x1="18" y1="10" x2="18" y2="18"/></svg></span></span></button>

        <!-- Creatures category — icons match drawHumanoid()/drawWolf()/drawChicken() exactly -->
        <button data-tool="human" data-group="creatures" data-label="มนุษย์"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="6" r="3.5" fill="#f3d08b"/><rect x="4" y="9" width="8" height="6" fill="#426c9e"/></svg></button>
        <button data-tool="elf" data-group="creatures" data-label="เอลฟ์"><svg class="ti" viewBox="0 0 16 16"><polygon points="5,5 2.5,3.4 5.4,6.6" fill="#b8f0bd"/><polygon points="11,5 13.5,3.4 10.6,6.6" fill="#b8f0bd"/><circle cx="8" cy="6" r="3.2" fill="#b8f0bd"/><rect x="5" y="9" width="6" height="7" fill="#398b66"/></svg></button>
        <button data-tool="dwarf" data-group="creatures" data-label="คนแคระ"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="7" r="3.6" fill="#e3b77d"/><rect x="3" y="10" width="10" height="5" fill="#7c5740"/><rect x="5.5" y="8.5" width="5" height="3" fill="#ddd4c0"/></svg></button>
        <button data-tool="orc" data-group="creatures" data-label="ออร์ค"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="6" r="4.2" fill="#d49583"/><rect x="3" y="9.5" width="10" height="7" fill="#75414b"/><rect x="5.4" y="7.5" width="1.3" height="2" fill="#f4f1e6"/><rect x="9.3" y="7.5" width="1.3" height="2" fill="#f4f1e6"/></svg></button>
        <div class="tools-gap" data-group="creatures" aria-hidden="true"></div>
        <button data-tool="wolf" data-group="creatures" data-label="หมาป่า"><svg class="ti" viewBox="0 0 16 16"><path d="M3,11 L4,7 L6.5,4.8 L10,5.4 L13,7.5 L12.6,11 Z" fill="#6b6f73"/><path d="M5.8,5 L4.8,2.6 L7.2,4.4 Z" fill="#54585b"/><path d="M8.6,4.8 L8.2,2.6 L10.4,4.6 Z" fill="#54585b"/><path d="M12.6,7.8 L14.6,8.6 L12.4,9.4 Z" fill="#4d5154"/><path d="M3.4,9 L0.8,6.6 L2.4,10.4 Z" fill="#6b6f73"/><rect x="4.6" y="10.6" width="1" height="2.2" fill="#3f4245"/><rect x="10.6" y="10.6" width="1" height="2.2" fill="#3f4245"/></svg></button>
        <button data-tool="chicken" data-group="creatures" data-label="ไก่"><svg class="ti" viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="2.1" ry="1.6" fill="#f2ede0"/><ellipse cx="9.6" cy="6.6" rx="1" ry="1" fill="#f2ede0"/><circle cx="9.5" cy="5.8" r="0.5" fill="#d94a3a"/><polygon points="10.4,6.6 11.2,6.9 10.4,7.3" fill="#e8912b"/><rect x="7.6" y="9.4" width="0.75" height="1" fill="#f2ede0"/></svg></button>

        <!-- Terrain category — icons match the exact tile renderer in disasters-terrain-render.js -->
        <button data-tool="ore_stone" data-group="terrain" data-label="เสกแร่ (หิน)"><svg class="ti" viewBox="0 0 16 16"><polygon points="3.5,11 5.5,4.5 9.5,3.8 12.6,7.5 11,10.4" fill="#7d7d7d"/><polygon points="5.5,4.5 8.3,3.4 9.6,6.8 7.4,7.7" fill="#a8a8a8"/></svg></button>
        <button data-tool="ore_iron" data-group="terrain" data-label="เสกแร่ (เหล็ก)"><svg class="ti" viewBox="0 0 16 16"><polygon points="3.5,11 5.5,4.5 9.5,3.8 12.6,7.5 11,10.4" fill="#6b4030"/><polygon points="5.5,4.5 8.3,3.4 9.6,6.8 7.4,7.7" fill="#9c5b41"/><circle cx="7.4" cy="6.6" r="0.7" fill="#c76b3f"/><circle cx="9.5" cy="8.6" r="0.55" fill="#c76b3f"/></svg></button>
        <button data-tool="ore_gold" data-group="terrain" data-label="เสกแร่ (ทอง)"><svg class="ti" viewBox="0 0 16 16"><polygon points="3.5,11 5.5,4.5 9.5,3.8 12.6,7.5 11,10.4" fill="#8a7a52"/><polygon points="5.5,4.5 8.3,3.4 9.6,6.8 7.4,7.7" fill="#c7a94a"/><circle cx="7.2" cy="6.4" r="0.8" fill="#ffd85c"/><circle cx="9.6" cy="8.4" r="0.6" fill="#ffd85c"/></svg></button>
        <button data-tool="berries" data-group="terrain" data-label="พุ่มเบอร์รี่"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.7" fill="#3d6b3a"/><circle cx="6.1" cy="8.9" r="2.5" fill="#4f8a49"/><circle cx="10.1" cy="8.6" r="2.3" fill="#4f8a49"/><circle cx="6.6" cy="7.3" r="0.8" fill="#c23a5e"/><circle cx="9.6" cy="6.8" r="0.8" fill="#c23a5e"/><circle cx="8.2" cy="9.3" r="0.8" fill="#c23a5e"/></svg></button>
        <button data-tool="tree" data-group="terrain" data-label="ป่า"><svg class="ti" viewBox="0 0 16 16"><polygon points="8,1.8 3.6,12.4 12.4,12.4" fill="#2a6844"/><polygon points="8,4.6 5,9.8 11,9.8" fill="#6ea95a"/><rect x="7.2" y="11.4" width="1.6" height="2.4" fill="#4b3524"/></svg></button>
        <button data-tool="water" data-group="terrain" data-label="น้ำ"><svg class="ti" viewBox="0 0 16 16"><rect x="0" y="0" width="16" height="16" rx="2" fill="#378bc0"/><path d="M3,6 Q8,3 13,6" stroke="#b8e4ed" stroke-width="1" fill="none"/><path d="M1,11 Q8,9 15,11" stroke="#8fd2e4" stroke-width="1" fill="none"/></svg></button>
        <button data-tool="water_ice" data-group="terrain" data-label="น้ำแข็ง"><svg class="ti" viewBox="0 0 16 16"><rect x="0" y="0" width="16" height="16" rx="2" fill="#bfe3ea"/><path d="M2,3 L8,9 L5,14 M8,9 L14,6" stroke="#ffffffcc" stroke-width="1" fill="none"/></svg></button>
        <button data-tool="mountain" data-group="terrain" data-label="ภูเขา"><svg class="ti" viewBox="0 0 16 16"><polygon points="2,13 8,3 14,13" fill="#5b6062"/><polygon points="8,3 11,9 8,8 5,9" fill="#717474"/></svg></button>
        <button data-tool="mountain_snow" data-group="terrain" data-label="ภูเขาหิมะ"><svg class="ti" viewBox="0 0 16 16"><polygon points="2,13 8,3 14,13" fill="#ffffff"/><polygon points="8,3 11,9 8,8 5,9" fill="#b8c8cb"/></svg></button>
        <div class="tools-gap" data-group="terrain" aria-hidden="true"></div>
        <button data-tool="fire" data-group="terrain" data-label="ไฟ"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="#ff8a22"/><circle cx="8" cy="7" r="2.5" fill="#ffe27a"/></svg></button>
        <button data-tool="erase" data-group="terrain" data-label="ลบ"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="12" width="14" height="7" rx="1" transform="rotate(-25 3.5 12)"/><line x1="4" y1="19" x2="20" y2="19"/></svg></button>

        <!-- Disasters category — colors match the actual fx (boltFlash, shockwave/ash, tornado rings, volcano lava+smoke, infected pulse) -->
        <button data-tool="lightning" data-group="disasters" data-label="ฟ้าผ่า" class="danger"><svg class="ti" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 4 14 11 14 9 22 20 9 13 9"/></svg></button>
        <button data-tool="meteor" data-group="disasters" data-label="อุกกาบาต" class="danger"><svg class="ti" viewBox="0 0 16 16"><rect x="0" y="0" width="16" height="16" rx="2" fill="#4a4038"/><path d="M3,4 L8,11 L13,5" stroke="#2c241f" stroke-width="1" fill="none"/><circle cx="8" cy="8" r="2" fill="#ff8a22"/></svg></button>
        <button data-tool="tornado" data-group="disasters" data-label="ทอร์นาโด" class="danger"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="#c9d6e0" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16"/><path d="M6 9h13"/><path d="M8 13h10"/><path d="M10 17h6"/><path d="M11 21h3"/></svg></button>
        <button data-tool="volcano" data-group="disasters" data-label="ภูเขาไฟ" class="danger"><svg class="ti" viewBox="0 0 16 16"><polygon points="2,13 8,3 14,13" fill="#5b6062"/><polygon points="8,3 11,9 8,8 5,9" fill="#717474"/><circle cx="8" cy="6.5" r="2" fill="#cf3d1e"/><circle cx="8" cy="3" r="1.6" fill="#8a8f92" opacity=".7"/></svg></button>
        <button data-tool="plague" data-group="disasters" data-label="โรคระบาด" class="danger"><svg class="ti" viewBox="0 0 16 16"><circle cx="8" cy="9" r="2.6" fill="#8a8f92"/><rect x="5.5" y="11.5" width="5" height="3.5" fill="#5b6062"/><circle cx="8" cy="4" r="1.8" fill="#7ee06a"/></svg></button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <!-- Split into ES modules with explicit export/import between files
       (see each file's own import list for exactly what it pulls from
       where). main.js is the entry point: as a module script it's
       deferred automatically, and its static import graph pulls in
       every other file transitively, so this is the only <script> tag
       needed. -->
  <script type="module" src="main.js"></script>
</body>
</html>
